services:
  inventory-api:
    build:
      # Repo root, not the service directory: the Dockerfile's COPY paths
      # (e.g. "services/inventory-service/src/...") are written relative to
      # the solution root, matching how it's built from docker-compose.yml.
      context: ../..
      dockerfile: services/inventory-service/Dockerfile
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Must be Database__ConnectionString — matches Program.cs's
      # builder.Configuration["Database:ConnectionString"] read. The previous
      # ConnectionStrings__DefaultConnection key was never read by the app at
      # all, so the container crashed on every request with
      # "Database:ConnectionString is not configured."
      - Database__Provider=PostgreSQL
      - Database__ConnectionString=${INVENTORY_DB_CONNECTION}
      - Redis__ConnectionString=${REDIS_CONNECTION}
      - RabbitMQ__Host=rabbitmq
      - ServiceName=inventory-service
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - inventory-network

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventory_db
    ports:
      - "5434:5432"
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    networks:
      - inventory-network

volumes:
  inventory-db-data:

networks:
  inventory-network:
    driver: bridge
