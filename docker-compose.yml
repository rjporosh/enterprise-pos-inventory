
# Full-stack local development compose file: shared Postgres/Redis/RabbitMQ/Seq
# plus all four backend services. Each service also ships its own standalone
# services/<name>/docker-compose.yml with an isolated database/broker on
# different host ports, for working on one service in isolation — this file
# is for running the whole platform together (e.g. to exercise the POS ->
# Inventory RabbitMQ integration, or auth/notification end-to-end).

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  seq-data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: enterprise-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enterprise-network

  redis:
    image: redis:7-alpine
    container_name: enterprise-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enterprise-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: enterprise-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics check_port_connectivity || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - enterprise-network

  seq:
    image: datalust/seq:latest
    container_name: enterprise-seq
    restart: always
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_ADMINPASSWORD: admin123
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data
    networks:
      - enterprise-network

  inventory-api:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    container_name: inventory-api
    restart: always
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Database__Provider=PostgreSQL
      - Database__ConnectionString=Host=postgres;Port=5432;Database=inventory_db;Username=postgres;Password=postgres
      - Redis__ConnectionString=redis:6379
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - Cors__AllowedOrigins__0=http://localhost:3000
      - Cors__AllowedOrigins__1=http://localhost:3001
      - Seq__Url=http://seq:80
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seq:
        condition: service_started
    networks:
      - enterprise-network

  pos-api:
    build:
      context: .
      dockerfile: services/pos-service/Dockerfile
    container_name: pos-api
    restart: always
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Database__Provider=PostgreSQL
      - Database__ConnectionString=Host=postgres;Port=5432;Database=pos_db;Username=postgres;Password=postgres
      - Redis__ConnectionString=redis:6379
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - Cors__AllowedOrigins__0=http://localhost:3000
      - Cors__AllowedOrigins__1=http://localhost:3001
      - Seq__Url=http://seq:80
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seq:
        condition: service_started
    networks:
      - enterprise-network

  auth-api:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: auth-api
    restart: always
    ports:
      - "5100:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Database__Provider=Postgres
      - ConnectionStrings__AuthDb=Host=postgres;Port=5432;Database=auth_service;Username=postgres;Password=postgres
      - Redis__ConnectionString=redis:6379
      - RabbitMq__HostName=rabbitmq
      - RabbitMq__Port=5672
      - RabbitMq__UserName=guest
      - RabbitMq__Password=guest
      - Cors__AllowedOrigins__0=http://localhost:3000
      - Cors__AllowedOrigins__1=http://localhost:3001
      - Seq__Url=http://seq:80
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seq:
        condition: service_started
    networks:
      - enterprise-network

  notification-api:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: notification-api
    restart: always
    ports:
      - "5300:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Database__Provider=Postgres
      - ConnectionStrings__NotificationDb=Host=postgres;Port=5432;Database=notification_service;Username=postgres;Password=postgres
      - RabbitMq__HostName=rabbitmq
      - RabbitMq__Port=5672
      - RabbitMq__UserName=guest
      - RabbitMq__Password=guest
      - Cors__AllowedOrigins__0=http://localhost:3000
      - Cors__AllowedOrigins__1=http://localhost:3001
      - Seq__Url=http://seq:80
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seq:
        condition: service_started
    networks:
      - enterprise-network

  gateway-api:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: gateway-api
    restart: always
    ports:
      # 5000 deliberately avoided — macOS's AirPlay Receiver claims it by default on every Mac,
      # so any docker-compose up would otherwise fail with "address already in use" out of the box.
      - "5010:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Cors__AllowedOrigins__0=http://localhost:3000
      - Cors__AllowedOrigins__1=http://localhost:3001
      - Seq__Url=http://seq:80
      - Services__auth-service__HealthUrl=http://auth-api:8080/health
      - Services__notification-service__HealthUrl=http://notification-api:8080/health
      - Services__inventory-service__HealthUrl=http://inventory-api:8080/health
      - Services__pos-service__HealthUrl=http://pos-api:8080/health
      - ReverseProxy__Clusters__auth-cluster__Destinations__destination1__Address=http://auth-api:8080/
      - ReverseProxy__Clusters__notification-cluster__Destinations__destination1__Address=http://notification-api:8080/
      - ReverseProxy__Clusters__inventory-cluster__Destinations__destination1__Address=http://inventory-api:8080/
      - ReverseProxy__Clusters__pos-cluster__Destinations__destination1__Address=http://pos-api:8080/
    depends_on:
      - auth-api
      - notification-api
      - inventory-api
      - pos-api
    networks:
      - enterprise-network

networks:
  enterprise-network:
    driver: bridge
